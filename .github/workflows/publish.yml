name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Skill check
        run: pnpm skill:check
      - name: Release manifests agree
        run: pnpm release:check
      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@latest
      - name: Refuse an existing version
        run: |
          set -euo pipefail
          for manifest in package.json packages/ip-axi/package.json; do
            name=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::error::${name}@${version} is already published"
              exit 1
            fi
          done
      - name: Publish ip-search-mcp
        run: npm publish --provenance --access public
      - name: Publish ip-axi
        working-directory: packages/ip-axi
        run: npm publish --provenance --access public
